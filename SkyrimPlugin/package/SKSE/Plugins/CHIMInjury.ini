; CHIM Injury Framework - game-side fallback settings
;
; When the CHIM server is running, the settings on the CHIM web page
; (Server Plugins -> CHIM Injury Framework -> Plugin Page) override this file.
; This file is only used while the server plugin cannot be reached.
;
; Log file: Documents\My Games\Skyrim Special Edition\SKSE\chim-injury.log

[General]
; 1 = on, 0 = off
bEnabled = 1
; Debug: detailed log (every hit, health before and after, overlay slots).
bDebug = 0
; On-screen messages about new wounds and healing.
bNotifications = 1
; Write wounds into CHIM's event memory so nearby NPCs know about them.
bLogToChim = 1
; 0 = errors, 1 = warnings, 2 = info, 3 = debug (debug mode always logs at level 3)
iLogLevel = 2

[Tracking]
bTrackPlayer = 1
; Followers are found automatically (no NFF needed).
bTrackFollowers = 1

[Visuals]
; Wounds drawn on the body with RaceMenu body overlays (needs RaceMenu).
bShowOverlays = 1
bShowOnPlayer = 1
; Overlay strength in percent (10-100).
iOverlayStrength = 100
; Wounded movement and idle animations (only with an animation pack that ships CHIMInjury_Animations.esp).
bAnimations = 1
; 1 = light, 2 = medium, 3 = severe wounds and worse get animations.
iAnimMinSeverity = 2

[Wounds]
; A hit makes a wound if it takes at least this much of the maximum health (or is a power or sneak attack).
fMinDamagePercent = 5
; Medium and severe wound thresholds (percent of maximum health in one hit).
fMediumDamagePercent = 12
fSevereDamagePercent = 25
iMaxWounds = 6

[Healing]
; Game days until light and medium wounds heal by themselves. Severe wounds need healing and then sleep.
fLightHealDays = 1
fMediumHealDays = 3
; Minimum health a potion or spell must restore to heal wounds (concentration healing spells always count).
fHealMinAmount = 15
; Minimum hours of sleep in a bed that fully heal treated severe wounds.
fMinSleepHours = 6

[Server]
; Leave empty: the CHIM server address is taken from AIAgent.ini or found automatically,
; the same way CHIM does it. Set only if CHIM Injury Framework cannot reach the server.
sServer =
iPort =
